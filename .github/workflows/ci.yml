name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: All tests (every package checks itself against the rulebook)
        run: uv run pytest -q
      - name: examples/ is up to date
        run: |
          uv run python packages/medbag_common/export_examples.py > /dev/null
          git add -N packages/medbag_common/examples
          git diff --exit-code packages/medbag_common/examples
