[project]
name = "pills"
version = "0.1.0"
description = "Pill detection with YOLO26n on the straightened tray (WBS 4.3). Owner: 鄂弘 Alex"
requires-python = ">=3.11"
dependencies = ["medbag-common"]

[tool.uv.sources]
medbag-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pills"]
