[project]
name = "prep"
version = "0.1.0"
description = "Image preprocessing: label cleanup, tray straightening, change detection (WBS 3.1, 4.1, 4.2). Owner: 李佳修 Joshua"
requires-python = ">=3.11"
dependencies = ["medbag-common"]

[tool.uv.sources]
medbag-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prep"]
