[project]
name = "voice"
version = "0.1.0"
description = "Voice questions answered with Gemini, only from her schedule and log (WBS 4.11, Should). Owner: 鄂弘 Alex"
requires-python = ">=3.11"
dependencies = ["medbag-common"]

[tool.uv.sources]
medbag-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice"]
