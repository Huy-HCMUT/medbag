[project]
name = "check"
version = "0.1.0"
description = "Fingerprints, identification, fill/pre-dose/dose checks, alert rules (WBS 4.4-4.8). Owner: 劉亮萱 Emily"
requires-python = ">=3.11"
dependencies = ["medbag-common"]

[tool.uv.sources]
medbag-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/check"]
