[project]
name = "medbag-common"
version = "0.1.0"
description = "Shared types and method signatures for The Talking Medicine Bag (WBS 1.3)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medbag_common"]
