[project]
name = "label"
version = "0.1.0"
description = "Label reading: Gemini with Tesseract fallback, field rule checks (WBS 3.3-3.5). Owner: 王有財 Sam"
requires-python = ">=3.11"
dependencies = ["medbag-common"]

[tool.uv.sources]
medbag-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/label"]
